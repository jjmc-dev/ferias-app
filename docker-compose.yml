name: ferias-app

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-22.04
    restart: "no"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}
      MSSQL_PID: Developer

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - ferias_sqlserver_data:/var/opt/mssql

    networks:
      - ferias_network

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  sqlserver-init:
    build:
      context: ./docker/sqlserver
      dockerfile: Dockerfile

    restart: "no"

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}

    networks:
      - ferias_network

    depends_on:
      sqlserver:
        condition: service_healthy

  backend:
    profiles: ["app"]

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_ENGINE: sqlserver
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-ferias}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - ferias_network

    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]

    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "127.0.0.1:8501:8501"

    networks:
      - ferias_network

    depends_on:
      - backend

volumes:
  ferias_sqlserver_data:
    name: ferias_sqlserver_data

networks:
  ferias_network:
    name: ferias_network
    driver: bridge
